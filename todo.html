<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    :root {
      --bg: #2b2b2b;
      --text: #f1f1f1;
      --accent: #00d4e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      font-size: 36px;
      margin-bottom: 30px;
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    #todo-input {
      flex: 1;
      padding: 12px 20px;
      border: 2px solid #444;
      border-radius: 30px;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    #todo-input:focus {
      border-color: var(--accent);
    }

    #add-btn {
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      background: var(--accent);
      color: #003c40;
      font-weight: bold;
      cursor: pointer;
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #363636;
    }

    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    li span {
      flex: 1;
    }

    li.done span {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .delete {
      border: none;
      background: transparent;
      color: #888;
      font-size: 18px;
      cursor: pointer;
    }

    .delete:hover {
      color: #ff5c5c;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>TODO APP</h1>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Write anything you want to add" autocomplete="off">
      <button type="submit" id="add-btn">Add</button>
    </form>

    <ul id="todo-list"></ul>
  </div>

  <script>
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");

    // On récupère les tâches sauvegardées (ou des tâches par défaut)
    let todos = JSON.parse(localStorage.getItem("todos")) || [
      { text: "Initialize project with HTML, CSS and JS", done: false },
      { text: "Data is saved with localStorage", done: false },
      { text: "Modern CSS design with custom properties", done: false },
      { text: "Learn flexbox and responsive web design", done: false }
    ];

    function save() {
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = "";

      todos.forEach((todo, index) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => {
          todos[index].done = checkbox.checked;
          save();
          render();
        });

        const span = document.createElement("span");
        span.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "🗑";
        del.addEventListener("click", () => {
          todos.splice(index, 1);
          save();
          render();
        });

        li.append(checkbox, span, del);
        list.appendChild(li);
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (text === "") return;

      todos.push({ text: text, done: false });
      save();
      render();
      input.value = "";
    });

    render();
  </script>
</body>
</html>
